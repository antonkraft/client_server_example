name: PEP 8 check

on:
  push:
  pull_request:

jobs:
  pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"

      - name: Install pycodestyle
        run: python -m pip install pycodestyle

      - name: Check PEP 8
        run: python -m pycodestyle .
